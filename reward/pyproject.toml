# Package specification for lure (Library-Use Rewards).
# https://packaging.python.org/en/latest/specifications/pyproject-toml/#pyproject-toml-spec

[build-system]
# 77+ understands the SPDX `license` expression below
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lure"]

[tool.setuptools.package-data]
# marks the package as typed, so type checkers use its annotations
lure = ["py.typed"]

[tool.setuptools.dynamic]
# bump __version__ in lure/__init__.py before triggering a release
version = { attr = "lure.__version__" }

[project]
name = "lure"
dynamic = ["version"]
readme = "README.md"
description = "lure (Library-Use Rewards) - reward functions that score LLM code for reusing libraries."
authors = [{ name = "Lukas Twist", email = "itsluketwist@gmail.com" }]
# lure is MIT licensed, separately from the rest of the repository (CC BY 4.0)
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "code generation",
    "grpo",
    "library reuse",
    "llm",
    "reinforcement learning",
    "reward function",
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# 3.10 is the first version with sys.stdlib_module_names
requires-python = ">=3.10"
# no dependencies - lure only uses the standard library
dependencies = []

# the repository stays private for the first release - uncomment once it is public
