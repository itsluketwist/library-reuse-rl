name: lure release to pypi
on:
  workflow_dispatch:

jobs:

  pypi:
    name: Publish to PyPI

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: reward

    environment:
      name: release
      url: https://pypi.org/p/lure

    # listing any permission sets the rest to none, so contents: read is needed for the
    # checkout step to read this (private) repository
    permissions:
      id-token: write
      contents: read

    steps:

      - name: 1. Checkout the code...
        uses: actions/checkout@v4

      - name: 2. Configure uv...
        uses: astral-sh/setup-uv@v6

      - name: 3. Build the package...
        run: uv build

      - name: 4. Check the package metadata and readme will render on PyPI...
        run: uvx twine check --strict dist/*

      - name: 5. Publish package to PyPI
        run: uv publish --trusted-publishing always
