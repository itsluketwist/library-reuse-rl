name: benchmark release to pypi and hf
on:
  workflow_dispatch:

jobs:

  pypi:
    name: Publish to PyPI

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: benchmark

    environment:
      name: release
      url: https://pypi.org/p/libreusebench

    # listing any permission sets the rest to none, so contents: read is needed for the
    # checkout step to read this (private) repository
    permissions:
      id-token: write
      contents: read

    steps:

      - name: 1. Checkout the code...
        uses: actions/checkout@v4

      - name: 2. Configure uv...
        uses: astral-sh/setup-uv@v6

      - name: 3. Build the package...
        run: uv build

      - name: 4. Publish package to PyPI
        run: uv publish --trusted-publishing always

  huggingface:
    name: Upload to Hugging Face

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: benchmark

    environment:
      name: release
      url: https://huggingface.co/datasets/itsluketwist/LibReuseBench

    # only needs to read the repository - the hub is authenticated with the HF_TOKEN secret
    permissions:
      contents: read

    steps:

      - name: 1. Checkout the code...
        uses: actions/checkout@v4

      - name: 2. Configure uv...
        uses: astral-sh/setup-uv@v6

      - name: 3. Generate VERSION file from libreusebench/__init__.py...
        run: python3 -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('libreusebench/__init__.py').read()).group(1))" > VERSION

      - name: 4. Upload dataset to Hugging Face Hub
        # a write token for the dataset, rather than trusted publishing (which can't upload to a
        # gated repo) - stored as a secret of the release environment
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uvx --from 'huggingface_hub>=1.19.0' hf upload itsluketwist/LibReuseBench docs/HF_README.md README.md --repo-type dataset
          uvx --from 'huggingface_hub>=1.19.0' hf upload itsluketwist/LibReuseBench VERSION VERSION --repo-type dataset
          uvx --from 'huggingface_hub>=1.19.0' hf upload itsluketwist/LibReuseBench libreusebench/data/CANARY.txt CANARY.txt --repo-type dataset
          uvx --from 'huggingface_hub>=1.19.0' hf upload itsluketwist/LibReuseBench libreusebench/data/test.jsonl data/test.jsonl --repo-type dataset
          uvx --from 'huggingface_hub>=1.19.0' hf upload itsluketwist/LibReuseBench libreusebench/data/dev.jsonl data/dev.jsonl --repo-type dataset
          uvx --from 'huggingface_hub>=1.19.0' hf upload itsluketwist/LibReuseBench libreusebench/data/control.jsonl data/control.jsonl --repo-type dataset
