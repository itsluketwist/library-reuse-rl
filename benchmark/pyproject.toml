# Package specification for the BigCodeBenchReuse benchmark.
# https://packaging.python.org/en/latest/specifications/pyproject-toml/#pyproject-toml-spec

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bcbreuse"]

[tool.setuptools.package-data]
# ship the benchmark splits, plus the canary string marking them as eval-only data
bcbreuse = ["data/*.jsonl", "CANARY.txt"]

[project]
name = "bcbreuse"
readme = "docs/PYPI_README.md"
# bump the version here before triggering a release
version = "0.1.0"
description = "BigCodeBenchReuse - a library-agnostic, test-backed benchmark for measuring library reuse."
authors = [{ name = "Lukas Twist", email = "itsluketwist@gmail.com" }]
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "llm-codegen-research",
]

[project.urls]
Homepage = "https://github.com/itsluketwist/library-reuse-rl"

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "uv",
]

[project.scripts]
bcbeval = "bcbreuse.cli:main"
