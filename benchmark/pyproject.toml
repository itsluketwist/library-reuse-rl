# Package specification for the LibReuseBench benchmark.
# https://packaging.python.org/en/latest/specifications/pyproject-toml/#pyproject-toml-spec

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["libreusebench"]

[tool.setuptools.package-data]
# ship the benchmark splits, plus the canary string marking them as eval-only data
libreusebench = ["data/*.jsonl", "CANARY.txt"]

[project]
name = "libreusebench"
readme = "docs/PYPI_README.md"
# bump the version here before triggering a release
version = "0.1.0"
description = "LibReuseBench - a library-agnostic, test-backed benchmark for measuring library reuse."
authors = [{ name = "Lukas Twist", email = "itsluketwist@gmail.com" }]
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "llm-codegen-research",
    # finds the code in a response and the libraries it imports and uses
    "lure>=0.1.1",
    # code size (logical lines) and maintainability index of each response's code
    "radon",
]

[project.urls]
Homepage = "https://github.com/itsluketwist/library-reuse-rl"

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "uv",
]

[project.scripts]
libreuseeval = "libreusebench.cli:main"

# while developing, use the lure package from this repo (reward/) - this only affects local
# installs, the published package just requires lure from pypi
[tool.uv.sources]
lure = { path = "../reward", editable = true }
