# Package specification for the LibReuseBench benchmark.
# https://packaging.python.org/en/latest/specifications/pyproject-toml/#pyproject-toml-spec

[build-system]
# 77+ understands the SPDX `license` expression below
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["libreusebench"]

[tool.setuptools.package-data]
# ship the benchmark splits, plus the canary string marking them as eval-only data
libreusebench = ["data/*.jsonl", "CANARY.txt"]

[tool.setuptools.dynamic]
# bump __version__ in libreusebench/__init__.py before triggering a release
version = { attr = "libreusebench.__version__" }

[project]
name = "libreusebench"
dynamic = ["version"]
readme = "docs/PYPI_README.md"
description = "LibReuseBench - a library-agnostic, execution-backed benchmark for measuring library reuse."
authors = [{ name = "Lukas Twist", email = "itsluketwist@gmail.com" }]
# apache-2.0, separately from the rest of the repository (CC BY 4.0), to match BigCodeBench,
# which the tasks are adapted from - NOTICE credits it
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "llm-codegen-research",
    # finds the code in a response and the libraries it imports and uses
    "lure>=0.1.1",
    # code size (logical lines) and maintainability index of each response's code
    "radon",
]

# the repository stays private for the first release - uncomment once it is public
# [project.urls]
# Homepage = "https://github.com/itsluketwist/library-reuse-rl"

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "uv",
]

[project.scripts]
libreuseeval = "libreusebench.cli:main"

# while developing, use the lure package from this repo (reward/) - this only affects local
# installs, the published package just requires lure from pypi
[tool.uv.sources]
lure = { path = "../reward", editable = true }
