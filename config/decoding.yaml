# decoding config - sampling parameters used when generating responses

default:
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  max_new_tokens: 8192

random:
  temperature: 1.0
  top_p: 1.0
  top_k: null
  max_new_tokens: 8192

greedy:
  temperature: 0.0
  top_p: 1.0
  top_k: null
  max_new_tokens: 8192
