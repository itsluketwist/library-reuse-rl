  passes_syntax_check: 0
  external_lib_imported: 0
  external_lib_used: 0
  target_lib_imported: 0.5
  target_lib_used: 1.0

# halfway between usage and target, the average of their weights (8a38): a target library
# earns the full library credit (1.5), any other library half of it (0.75)
lu-target-half:
  correct_format: 0.25
  passes_syntax_check: 0.25
  external_lib_imported: 0.25
  external_lib_used: 0.5
  target_lib_imported: 0.25
  target_lib_used: 0.5

