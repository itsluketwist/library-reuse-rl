  passes_syntax_check: 0
  external_lib_imported: 1.0
  external_lib_used: 0
  target_lib_imported: 0
  target_lib_used: 0
# ratio 0.33 (caf3)
lu-usage-s50:
  correct_format: 0.5
  passes_syntax_check: 0.5
  external_lib_imported: 0.5
  external_lib_used: 1.0
  target_lib_imported: 0
  target_lib_used: 0
# no shaping (a342)
lu-usage-s0:
  correct_format: 0
  passes_syntax_check: 0
  external_lib_imported: 0.5
  external_lib_used: 1.0
  target_lib_imported: 0
  target_lib_used: 0
# ratio 0.33 (255a)
lu-target-s50:
