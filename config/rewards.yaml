# reward config - named profiles, each mapping reward component names (see
# REWARD_COMPONENTS in src/grpo/rewards/base.py) to the weight they contribute when
# satisfied. a component left out of a profile never contributes for that profile.

full:
  correct_format: 0.1
  passes_syntax_check: 0.05
  passed_tests: 1.0
  internal_lib_imported: 0.05
  external_lib_imported: 0.05
  internal_lib_used: 0.05
  external_lib_used: 0.05

std:
  correct_format: 0.1
  passes_syntax_check: 0.1
  passed_tests: 1.0
  internal_lib_imported: 0.1
  internal_lib_used: 0.1

# product-choice task: reward naming an external tool over a roll-your-own answer.
# verified by matching the prose pick against the category allowlist (no execution).
product_choice:
  correct_format: 0.1
  names_external_lib: 1.0
  mentions_external_lib: 0.3
  avoids_diy: 0.2

# library-usage task: reward reusing an external library in code, detected
# programmatically from the imports (no execution). the target components only count
# libraries in the row's target_libs (the libraries listed for its task category).
#
# grpo compares rewards within each prompt's group of rollouts, so only the ratios between
# weights matter, not the maximum. every profile lists all six components, so a
# zero-weighted one is still logged (eg. how often import-only runs use what they import).
# the import / use split isn't varied: a rollout that imports a library almost always uses
# it (unused imports stayed around 1%), so moving weight between the two barely changes
# any rollout's reward

###############################################################################
#        the chosen rewards - the ones scripts/submit_grpo.sh trains with      #
###############################################################################
# all three give 0.25 / 0.25 for the shaping terms (correct_format, passes_syntax_check)
# and up to 1.5 library credit (max 2.0), so they differ only in which library use earns
# the credit. qwen3-8b runs: f2ca (import), 3079 (usage), f57b (target)

# import: any third-party import earns the library credit, used or not. "matched" as its
# shaping was matched to usage and target after the first ablations (lu-import, below)
lu-import-matched:
  correct_format: 0.25
  passes_syntax_check: 0.25
  external_lib_imported: 1.5
  external_lib_used: 0
  target_lib_imported: 0
  target_lib_used: 0

# usage: importing a library earns part of the credit, actually using it the rest
lu-usage:
  correct_format: 0.25
  passes_syntax_check: 0.25
  external_lib_imported: 0.5
  external_lib_used: 1.0
  target_lib_imported: 0
  target_lib_used: 0

# target: as usage, but only libraries in the task's target_libs count
lu-target:
  correct_format: 0.25
  passes_syntax_check: 0.25
  external_lib_imported: 0
  external_lib_used: 0
  target_lib_imported: 0.5
  target_lib_used: 1.0

###############################################################################
#           ablations - qwen3-8b, results in output/04_shaping_ablation/       #
###############################################################################
# shaping: the format and syntax weights changed, the library weights kept. the shaping
# ratio (each shaping weight / the library credit) is what training sees: 0.17 for the
# chosen rewards. library use peaked at 0.17-0.25, fell a little with more shaping and
# clearly with none

# import's first weights (0.5 / 0.5 / 1.0, ratio 0.5), also used by iteration 03's 8-epoch
# run 4474 and run 584b
lu-import:
  correct_format: 0.5
  passes_syntax_check: 0.5
  external_lib_imported: 1.0
  external_lib_used: 0
  target_lib_imported: 0
  target_lib_used: 0
# ratio 0.25 (4db4)
lu-import-s25:
  correct_format: 0.25
  passes_syntax_check: 0.25
  external_lib_imported: 1.0
  external_lib_used: 0
  target_lib_imported: 0
  target_lib_used: 0
