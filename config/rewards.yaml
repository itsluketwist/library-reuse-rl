# reward config - named profiles, each mapping reward component names (see
# REWARD_COMPONENTS in src/grpo/rewards/base.py) to the weight they contribute when
# satisfied. a component left out of a profile never contributes for that profile.

full:
  correct_format: 0.1
  passes_syntax_check: 0.05
  passed_tests: 1.0
  internal_lib_imported: 0.05
  external_lib_imported: 0.05
  internal_lib_used: 0.05
  external_lib_used: 0.05

std:
  correct_format: 0.1
  passes_syntax_check: 0.1
  passed_tests: 1.0
  internal_lib_imported: 0.1
  internal_lib_used: 0.1

# product-choice task: reward naming an external tool over a roll-your-own answer.
# verified by matching the prose pick against the category allowlist (no execution).
product_choice:
  correct_format: 0.1
  names_external_lib: 1.0
  mentions_external_lib: 0.3
  avoids_diy: 0.2

# library-usage task: reward reusing an external library in code, detected
# programmatically from the imports (no execution). the target components only count
# libraries in the row's target_libs (the libraries listed for its task category).
#
# experiment 01 compares three rewards - import, usage and target - each at three shaping
# weights: the weight given to correct_format and passes_syntax_check (0, 0.25 or 0.5),
# with the library weights fixed. grpo compares rewards within each prompt's group of
# rollouts, so only the ratios between weights matter, not the maximum. the unsuffixed
# profile is each reward's main run. every profile lists all six components, so a
# zero-weighted one is still logged (eg. how often import-only runs use what they import)
#
# the shaping ablations ask whether library credit alone keeps answers well formed. format
# and syntax failures were rare after epoch 1 (2-9% of rollouts), so little difference is
# expected. lu-target-half (below) gives half credit for a library outside the target
# list. the import / use split isn't ablated: a rollout that imports a library almost always uses
# it (unused imports stayed around 1% in every main run), so moving weight between the two
# barely changes any rollout's reward

# the iteration 01/02 reward (runs 4796, e650, 8672), kept for their records - the same
# weights as lu-usage
lu-v1:
  correct_format: 0.25
  passes_syntax_check: 0.25
  external_lib_imported: 0.5
  external_lib_used: 1.0
  target_lib_imported: 0
  target_lib_used: 0

# import: any third-party import earns the library credit, used or not - the
# main run first, then its two shaping ablations
lu-import:
  correct_format: 0.5
  passes_syntax_check: 0.5
  external_lib_imported: 1.0
  external_lib_used: 0
  target_lib_imported: 0
  target_lib_used: 0
lu-import-s25:
  correct_format: 0.25
  passes_syntax_check: 0.25
  external_lib_imported: 1.0
  external_lib_used: 0
  target_lib_imported: 0
  target_lib_used: 0
lu-import-s0:
  correct_format: 0
  passes_syntax_check: 0
  external_lib_imported: 1.0
  external_lib_used: 0
  target_lib_imported: 0
  target_lib_used: 0

# usage: importing a library earns part of the credit, actually using it the rest - the
# main run first, then its two shaping ablations
lu-usage:
  correct_format: 0.25
  passes_syntax_check: 0.25
  external_lib_imported: 0.5
  external_lib_used: 1.0
  target_lib_imported: 0
  target_lib_used: 0
lu-usage-s50:
  correct_format: 0.5
  passes_syntax_check: 0.5
  external_lib_imported: 0.5
  external_lib_used: 1.0
  target_lib_imported: 0
  target_lib_used: 0
lu-usage-s0:
  correct_format: 0
  passes_syntax_check: 0
  external_lib_imported: 0.5
  external_lib_used: 1.0
  target_lib_imported: 0
  target_lib_used: 0

# target: as usage, but only libraries in the task's target_libs count - the
# main run first, then its two shaping ablations
lu-target:
  correct_format: 0.25
  passes_syntax_check: 0.25
  external_lib_imported: 0
  external_lib_used: 0
  target_lib_imported: 0.5
  target_lib_used: 1.0
lu-target-s50:
  correct_format: 0.5
  passes_syntax_check: 0.5
  external_lib_imported: 0
  external_lib_used: 0
  target_lib_imported: 0.5
  target_lib_used: 1.0
lu-target-s0:
  correct_format: 0
  passes_syntax_check: 0
  external_lib_imported: 0
  external_lib_used: 0
  target_lib_imported: 0.5
  target_lib_used: 1.0

# halfway between usage and target: the average of their weights. a target library earns
# the full library credit (1.5), any other library half of it (0.75), where usage pays both
# the same and target pays the other library nothing. shaping as in the main runs
lu-target-half:
  correct_format: 0.25
  passes_syntax_check: 0.25
  external_lib_imported: 0.25
  external_lib_used: 0.5
  target_lib_imported: 0.25
  target_lib_used: 0.5
