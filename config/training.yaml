# GRPO recipe - shared by training (src/grpo/train_model.py) and inference
# (src/run_eval.py), via eval_decoding_profiles below.

# ==============================================================================
# hyperparameters - the dials actually varied between experiments
# ==============================================================================

libraries_requirements_file: setup/requirements/v1.txt  # system prompt library list, see src/prompts.py

num_train_epochs: 1

num_generations: 8  # rollouts per prompt (GRPO group size)
generation_batch_size: 8  # must match num_generations - one prompt's group per cycle
num_iterations: 1  # mu in the GRPO paper (reuse count) - kept at 1, see gradient_accumulation_steps

per_device_train_batch_size: 2  # completions per micro-batch - main memory lever
gradient_accumulation_steps: 32  # 8 prompts x 8 rollouts per optimizer step

beta: 0.01  # kl penalty coefficient
learning_rate: 1.0e-06
adam_beta2: 0.99
weight_decay: 0.1
max_grad_norm: 0.2
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_steps: 0.02  # ~2% of ~2198 steps (deprecated warmup_ratio alias, transformers>=4.57)

rollout_decoding_profile: default  # which eval_decoding_profiles entry rollouts sample with

# ==============================================================================
# evaluation
# ==============================================================================

eval_strategy: "steps"  # periodic held-out eval during training
eval_steps: 500
per_device_eval_batch_size: 16  # must be divisible by num_generations

# named decoding profiles, shared by training rollouts (see rollout_decoding_profile
# above) and run_eval.py (--decoding-profile/--decoding-config)
eval_decoding_profiles:
  default:
    temperature: 1.0
    top_p: 1.0
    top_k: 0  # disabled
    max_new_tokens: 8192
  greedy:
    temperature: 0.0
    top_p: 1.0
    top_k: 0  # disabled
    max_new_tokens: 8192
  qwen3:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    max_new_tokens: 8192

# ==============================================================================
# settings - mechanism/plumbing flags that rarely change between runs
# ==============================================================================

dtype: bfloat16
attn_implementation: flash_attention_2  # sdpa, flash_attention_2
bf16: true

sync_ref_model: True
ref_model_sync_steps: 64

use_vllm: true
vllm_mode: colocate  # single gpu, no separate vllm server (see scripts/submit_grpo.sh)

# unsloth-only settings
max_seq_length: 16384  # must cover the longest training prompt + max_new_tokens (8192,
gpu_memory_utilization: 0.4  # fraction of gpu memory unsloth's colocated vllm engine may reserve

# lora (parameter-efficient) fine-tuning. unsloth's vllm fast_inference (use_vllm above)
# does not support full fine-tuning, so instead of updating all weights we freeze the
# base model and train small low-rank adapters on top - see
# src/models.py::get_model_and_tokenizer. these are trl ModelConfig fields, parsed onto
# model_args by TrlParser (unlike the two unsloth-only settings above).
use_peft: true
lora_r: 512  # unsloth's suggested rank for approximating full fine-tuning - lower this
# to trade model capacity for less memory/faster steps once the run is validated
lora_alpha: 512  # scaling factor, kept equal to lora_r (unsloth convention)
lora_dropout: 0.0  # 0 lets unsloth use its faster fused lora kernel
lora_target_modules:  # the attention and mlp projections adapters are attached to
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

log_completions: false
log_level: info
logging_first_step: true
logging_steps: 10
logging_strategy: steps
report_to:
- wandb

save_strategy: "steps"  # so a run cancelled by the slurm time limit can resume (see
# train_model_with_grpo/get_last_checkpoint) instead of losing all progress
save_steps: 50  # frequent enough to land at least a few checkpoints within one job's walltime
save_total_limit: 1
