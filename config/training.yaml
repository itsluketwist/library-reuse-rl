# GRPO recipe - shared by training (src/grpo/train_model.py) and inference
# (src/run_eval.py), via eval_decoding_profiles below.

# ==============================================================================
# hyperparameters - the dials actually varied between experiments
# ==============================================================================

# libraries_requirements_file: setup/requirements/v1.txt  # libraries listed in the system prompt, see src/prompts.py

num_train_epochs: 1

num_generations: 8  # rollouts sampled per prompt - the group grpo scores against each other
generation_batch_size: 8  # completions generated per rollout phase; a multiple of num_generations (whole groups)
num_iterations: 1  # grpo's mu: optimizer passes that reuse each rollout batch before resampling

per_device_train_batch_size: 4  # completions per backward micro-batch - the main training-memory lever
gradient_accumulation_steps: 16  # micro-batches summed per optimizer step; grows the effective batch, not peak memory

beta: 0.01  # strength of the kl penalty holding the policy near the reference model
learning_rate: 1.0e-06

rollout_decoding_profile: default  # which eval_decoding_profiles entry rollouts sample with

# ==============================================================================
# evaluation
# ==============================================================================

eval_strategy: "steps"  # run held-out evaluation periodically during training
eval_steps: 10
per_device_eval_batch_size: 16  # must be divisible by num_generations

# named decoding profiles, shared by training rollouts (see rollout_decoding_profile
# above) and run_eval.py (--decoding-profile/--decoding-config). how many completions
# to sample per prompt (e.g. for LibReuseBench's pass@k or library-usage's per-response
# reuse stats) is an eval-only, per-run choice - see run_eval.py's --n-samples, not a
# profile field, since rollouts use num_generations above instead.
# enable_thinking drives the chat template's reasoning mode; api-served models take their
# provider's own default instead (see src/eval/generate_api.py).
eval_decoding_profiles:
  default:
    temperature: 1.0
    top_p: 1.0
    top_k: 0  # disabled
    max_new_tokens: 8192
    enable_thinking: true
  greedy:
    temperature: 0.0
    top_p: 1.0
    top_k: 0  # disabled
    max_new_tokens: 8192
    enable_thinking: true
  qwen3:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    max_new_tokens: 8192
    enable_thinking: true

# ==============================================================================
# settings - mechanism/plumbing flags that rarely change between runs
# ==============================================================================

dtype: bfloat16  # training model-load dtype only; run_eval leaves vllm at its auto default
attn_implementation: flash_attention_2  # sdpa, flash_attention_2
bf16: true  # train in mixed bf16 precision

sync_ref_model: True  # periodically pull the reference model back toward the current policy
ref_model_sync_steps: 64  # interval, in steps, between those reference-model resyncs

use_vllm: true  # generate rollouts with vllm (fast batched inference)
vllm_mode: colocate  # single gpu, no separate vllm server (see scripts/submit_grpo.sh)

# unsloth-only settings
max_seq_length: 16384  # ceiling on prompt + completion length; sizes the vllm kv cache, so keep as tight as the data allows
gpu_memory_utilization: 0.4  # share of gpu memory the colocated vllm engine reserves; the rest is left for training

# lora (parameter-efficient) fine-tuning settings
use_peft: true
lora_r: 256  # adapter rank - trades capacity for memory/speed (~512 approximates full fine-tuning)
lora_alpha: 256  # scaling factor, kept equal to lora_r (unsloth convention)
lora_dropout: 0.0  # 0 lets unsloth use its faster fused lora kernel
lora_target_modules:  # the attention and mlp projections adapters are attached to
- q_proj
- k_proj
- v_proj
- o_proj
- gate_proj
- up_proj
- down_proj

gradient_checkpointing: true  # recompute activations in the backward pass to save memory, at some compute cost
gradient_checkpointing_kwargs:
  use_reentrant: false

# optimizer settings
adam_beta2: 0.99  # adam's second-moment (gradient variance) decay rate
weight_decay: 0.1
max_grad_norm: 0.2  # gradient-clipping threshold - caps the update size for stability
lr_scheduler_type: cosine_with_min_lr  # cosine decay that levels off at a floor instead of reaching zero
lr_scheduler_kwargs:
  min_lr_rate: 0.1  # that floor, as a fraction of the peak learning rate
warmup_ratio: 0.02  # ramp the lr up over the first fraction of training

log_completions: false  # log sample rollout completions to wandb
log_level: info
logging_first_step: true
logging_steps: 10
logging_strategy: steps
report_to:
- wandb

save_strategy: "steps"  # so a run cancelled by the slurm time limit can resume from the last checkpoint
save_steps: 50  # frequent enough to land a few checkpoints within one job's walltime
save_total_limit: 1
