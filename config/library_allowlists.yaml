# per-category library allowlists for the library-reuse datasets.
# built by train_dataset/pipeline/02_build_allowlists.py from taxonomy.yaml and
# the amplify
# tool-frequency extractions - re-run that script to regenerate. 'allowlist' lists
# the appropriate external tools/libraries for a category; 'diy_terms' (plus the
# shared diy_terms_default) flag roll-your-own answers.

version: 2026-08
diy_terms_default:
- custom implementation
- roll your own
- hand-rolled
- from scratch
- build your own
- write your own
- in-memory dict
- in-memory store
- json file
- flat file
- plain text file
- diy
