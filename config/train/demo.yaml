# Model arguments
# model_name_or_path/model_revision are set by
# src/grpo/train_model.py::train_model_with_grpo from the model registry
# (config/models.yaml), not from this file.
dtype: bfloat16
attn_implementation: sdpa  # sdpa, flash_attention_2

# Data training arguments
# when set, builds the system prompt from the expert-programmer preamble plus the
# library list from this file (see src/prompts.py::build_system_prompt), and appends
# a lib-version suffix (e.g. "-libv1") to the output path. set to null to train
# without a system prompt (no library list, no suffix)
libraries_requirements_file: setup/requirements/v1.txt

# GRPO trainer config
sync_ref_model: True
ref_model_sync_steps: 64
beta: 0.01
bf16: true
use_peft: true
use_vllm: false
# periodically check generalisation against the val split during training (do_eval is
# derived automatically from eval_strategy by transformers, so it's not set directly)
eval_strategy: "steps"
eval_steps: 100
num_generations: 8
num_iterations: 2
# generation_batch_size controls how many prompts are expanded during rollout
# (total simultaneous sequences = generation_batch_size × num_generations)
# keep this small enough that the kv cache fits during generation
generation_batch_size: 8
per_device_eval_batch_size: 8
per_device_train_batch_size: 8
gradient_accumulation_steps: 4
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

learning_rate: 1.0e-06
adam_beta1: 0.9
adam_beta2: 0.99
weight_decay: 0.1
max_grad_norm: 0.2
log_completions: true
log_level: info
logging_first_step: true
logging_steps: 10
logging_strategy: steps
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1

num_train_epochs: 1

## generation config
# sampling parameters used during rollout generation (previously the "random"
# decoding profile in config/decoding.yaml - training has its own copy here since
# RL training, unlike eval, needs sampling diversity baked into its hyperparameters,
# not swapped out per run)
temperature: 1.0
top_p: 1.0
top_k: null
max_completion_length: 8192

report_to:
- wandb
reward_weights:
- 1.0
save_strategy: "steps"
save_steps: 100
save_total_limit: 1
warmup_ratio: 0.0001
