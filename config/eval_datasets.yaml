# eval dataset config - every path is paired with an explicit scorer from
# src/eval/scoring.py so similarly shaped datasets cannot be scored accidentally.

livecodebench:
  path: "data/eval/livecodebench.jsonl"
  evaluator: implement_tested
  python_executable: ".venv-eval/bin/python"
apps_introductory:
  path: "data/eval/apps_introductory.jsonl"
  evaluator: implement_tested
  python_executable: ".venv-eval/bin/python"
skywork_test:
  path: "data/train/skywork/test.jsonl"
  evaluator: implement_tested
  python_executable: ".venv-eval/bin/python"

# library-reuse held-out test splits (built by data/build/amplify/build.py and
# data/build/library/build.py); scored by the prose pick / import classification rather than
# execution (src/eval/scoring.py)
product_choice:
  path: "data/train/product_choice/test.jsonl"
  evaluator: product_choice
library_usage:
  path: "data/train/library_usage/test.jsonl"
  evaluator: library_usage
# the validation split, scored for every epoch's checkpoint to choose which epoch to report
# - so that choice never looks at the test split above
library_usage_val:
  path: "data/train/library_usage/val.jsonl"
  evaluator: library_usage
# the training split itself - not a held-out result, but shows how a model scores on the
# exact prompts training uses, e.g. to analyse the rewards a base model would start from
library_usage_train:
  path: "data/train/library_usage/train.jsonl"
  evaluator: library_usage
# the script pilot (data/build/library/build.py --pilot): every script wording of a sample of
# tasks, the dataset-v2 ones and the new staged ones, to compare the library use each draws
library_usage_script_pilot:
  path: "data/build/library/pilot/script_pilot.jsonl"
  evaluator: library_usage

# LibReuseBench v1 (archived in benchmark/v1/, see its README): library-agnostic stdin/stdout
# problems with executable test cases. the names are kept, as existing results use them
libreusebench_test:
  path: "benchmark/v1/data/test.jsonl"
  evaluator: libreusebench
  environment_root: ".libreuseeval-venvs"
# no-reuse-expected counterpart to the test split above - BigCodeBench seeds whose
# reference solution used no external library (see benchmark/libreusebench/load.py)
libreusebench_control:
  path: "benchmark/v1/data/control.jsonl"
  evaluator: libreusebench
  environment_root: ".libreuseeval-venvs"
# the function-style pilot (benchmark/v1/pipeline/function_pilot/): the same tasks reworded as
# a request for one named function, tested by calling it on each case's arguments. the
# evaluator scores a row as a function task when it has a function_name
libreusebench_function_test:
  path: "benchmark/v1/pipeline/function_pilot/test.jsonl"
  evaluator: libreusebench
  environment_root: ".libreuseeval-venvs"
libreusebench_function_control:
  path: "benchmark/v1/pipeline/function_pilot/control.jsonl"
  evaluator: libreusebench
  environment_root: ".libreuseeval-venvs"
# the first LibReuseBench v2 pilot (archived in benchmark/artefacts/pilot_1/, with the records
# it was built from): new function tasks generated from 60 pilot seeds - every task the agent
# review kept. the first is the reuse tasks, each with a reuse value (the lines of code a
# library saves), and the second is the control tasks, where no library should help. the
# request asked for tasks where a library saves a lot of code, which made them long and hard
libreusebench_v2_pilot:
  path: "benchmark/artefacts/pilot_1/test.jsonl"
  evaluator: libreusebench
  environment_root: ".libreuseeval-venvs"
libreusebench_v2_pilot_control:
  path: "benchmark/artefacts/pilot_1/control.jsonl"
  evaluator: libreusebench
  environment_root: ".libreuseeval-venvs"
# the second LibReuseBench v2 pilot (benchmark/artefacts/pilot_2/): 11 tasks from 20 seeds, each
# a short, library-agnostic rewording of its BigCodeBench seed. the request set no target for
# how much code a library saves, so the tasks span the low, medium and high reuse tiers
libreusebench_v2_pilot2:
  path: "benchmark/artefacts/pilot_2/test.jsonl"
  evaluator: libreusebench
  environment_root: ".libreuseeval-venvs"
