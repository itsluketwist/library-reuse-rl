# eval dataset config - every path is paired with an explicit scorer from
# src/eval/scoring.py so similarly shaped datasets cannot be scored accidentally.

livecodebench:
  path: "data/eval/livecodebench.jsonl"
  evaluator: implement_tested
  python_executable: ".venv-eval/bin/python"
apps_introductory:
  path: "data/eval/apps_introductory.jsonl"
  evaluator: implement_tested
  python_executable: ".venv-eval/bin/python"
skywork_test:
  path: "data/train/skywork/test.jsonl"
  evaluator: implement_tested
  python_executable: ".venv-eval/bin/python"
# regression test of general coding ability (built by data/build/download_eval.py): 164
# function tasks, scored by running each task's check() on the answer's function, in a venv
# built like LibReuseBench's (numpy for the tests, plus whatever the answers import)
humaneval_plus:
  path: "data/eval/humaneval_plus.jsonl"
  evaluator: humaneval
  environment_root: ".libreuseeval-venvs"

# library-reuse held-out test splits (built by data/build/amplify/build.py and
# data/build/library/build.py); scored by the prose pick / import classification rather than
# execution (src/eval/scoring.py)
product_choice:
  path: "data/train/product_choice/test.jsonl"
  evaluator: product_choice
library_usage:
  path: "data/train/library_usage/test.jsonl"
  evaluator: library_usage
# the validation split, scored for every epoch's checkpoint to choose which epoch to report
# - so that choice never looks at the test split above
library_usage_val:
  path: "data/train/library_usage/val.jsonl"
  evaluator: library_usage
# the training split itself - not a held-out result, but shows how a model scores on the
# exact prompts training uses, e.g. to analyse the rewards a base model would start from
library_usage_train:
  path: "data/train/library_usage/train.jsonl"
  evaluator: library_usage
# the script pilot (data/build/library/build.py --pilot): every script wording of a sample of
# tasks, the dataset-v2 ones and the new staged ones, to compare the library use each draws
library_usage_script_pilot:
  path: "data/build/library/pilot/script_pilot.jsonl"
  evaluator: library_usage

# LibReuseBench (benchmark/, see benchmark/docs/HF_README.md): short requests for one named
# Python function, written from BigCodeBench seeds, that name no library. the splits follow
# BigCodeBench - test from the seeds whose solution uses a library, control from the
# standard-library ones - and are the package's bundled data, built by
# benchmark/pipeline/05_build.py from the tasks both human reviewers approved.
#
# results from attempts before this dataset stay in output/ under names of their own, which no
# key here uses, so they are never mistaken for results on it: libreusebench_v1_test and
# libreusebench_v1_control (the archived stdin/stdout design, benchmark/v1/),
# libreusebench_function_* (its function-style pilot), and libreusebench_v2_pilot*,
# libreusebench_v2_full, libreusebench_v2_test and libreusebench_v2_control (builds before human
# review). see benchmark/HISTORY.md
libreusebench_test:
  path: "benchmark/libreusebench/data/test.jsonl"
  evaluator: libreusebench
  environment_root: ".libreuseeval-venvs"
libreusebench_control:
  path: "benchmark/libreusebench/data/control.jsonl"
  evaluator: libreusebench
  environment_root: ".libreuseeval-venvs"
