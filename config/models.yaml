# model registry - the base models we start from. written by hand: code never rewrites
# this file. models trained from these are registered separately, by training runs, in
# config/trained_models.yaml (and debug runs in config/debug_models.yaml, which is
# git-ignored) - eval looks a model key up in all three (see src/utils/config.py).
#
# every entry has a "base" (the huggingface model id) and a "path", which is blank here
# and, for a trained model, points at its checkpoint.
#
# entries default to "provider: vllm" (local weights). "provider: api" entries are served
# over an OpenAI-compatible api instead, and carry "api_key_env" (the .env variable holding
# the key) plus optional "base_url", "extra_params" and "max_tokens_param" - see the README
# and src/eval/generate_api.py

qwen3-debug:
  base: "Qwen/Qwen3-0.6B"
  path:

qwen3-4b:
  base: "Qwen/Qwen3-4B"
  path:

qwen3-8b:
  base: "Qwen/Qwen3-8B"
  path:

# candidate - being checked on isambard. a vision-language model with mostly linear-attention
# (gated deltanet) layers: training builds the full model (the vision encoder is carried but
# unused) and needs flash-linear-attention for fast linear-attention kernels (the [hpc] extra)
qwen3.5-9b:
  base: "Qwen/Qwen3.5-9B"
  path:

# candidate - being checked on isambard. a dense ~10b reasoning model (nemotron architecture,
# MIT licence). its chat template only reasons with enable_thinking on, which the decoding
# profiles pass through to both training and eval
domyn-small:
  base: "domyn/Domyn-Small-v1.0"
  path:

qwen3-14b:
  base: "Qwen/Qwen3-14B"
  path:

qwen3-32b:
  base: "Qwen/Qwen3-32B"
  path:

olmo3-7b:
  base: "allenai/OLMo-3-7B-Think"
  path:

deepseek-flash:
  provider: api
  base: "deepseek-flash"
  base_url: "https://api.deepseek.com"
  api_key_env: "DEEPSEEK_API_KEY"
  path:

gpt-5.6-luna:
  provider: api
  base: "gpt-5.6-luna"
  api_key_env: "OPENAI_API_KEY"
  max_tokens_param: "max_completion_tokens"
  path:

gpt-5.6-terra:
  provider: api
  base: "gpt-5.6-terra"
  api_key_env: "OPENAI_API_KEY"
  max_tokens_param: "max_completion_tokens"
  path:

gpt-5.6-sol:
  provider: api
  base: "gpt-5.6-sol"
  api_key_env: "OPENAI_API_KEY"
  max_tokens_param: "max_completion_tokens"
  path:

glm-5.2:
  provider: api
  base: "glm-5.2"
  base_url: "https://open.bigmodel.cn/api/paas/v4/"
  api_key_env: "ZHIPU_API_KEY"
  path:

kimi-k3:
  provider: api
  base: "kimi-k3"
  base_url: "https://api.moonshot.cn/v1"
  api_key_env: "MOONSHOT_API_KEY"
  path:
