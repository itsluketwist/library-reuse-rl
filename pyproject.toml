# Package specification, as defined here:
# https://packaging.python.org/en/latest/specifications/pyproject-toml/#pyproject-toml-spec

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# src is the experiment code; data.build (+ subpackages) is the dataset construction code, run
# by path but importable so its stages can share helpers and tests can import them. the folder
# is "data" (not "datasets") so it never shadows the HuggingFace `datasets` library.
packages = ["src", "data", "data.build", "data.build.amplify", "data.build.library"]

[project]
name = "src"
readme = "README.md"
version = "0.dev0"
authors = [{ name = "Lukas Twist", email = "itsluketwist@gmail.com" }]
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12.12,<3.13"

# core dependencies install everywhere (local dev + HPC): data handling, code analysis, the
# LLM sdk for the benchmark pipeline, and tooling. the GPU training/inference stack lives
# in the optional [hpc] extra below, since those wheels only exist on linux/CUDA.
dependencies = [
    # anthropic sdk for the benchmark pipeline's LLM stages (problem rewriting,
    # judging, solution generation)
    "anthropic",
    # the standalone LibReuseBench benchmark package (in benchmark/), installed editable so
    # the build pipeline and eval can import it; see [tool.uv.sources] below
    "libreusebench",
    # trl (in the [hpc] extra) needs >=4.7.0 - setting it here too keeps local dev on the
    # same version as the HPC, instead of uv locking a different one for each platform
    "datasets>=4.7.0",
    "huggingface_hub",
    "Jupyter",
    # lure (Library Usage REwards), the response parsing + library analysis shared by the
    # rewards, eval and benchmark - lives in reward/, installed editable (see below)
    "lure",
    "llm-codegen-research",
    # plotting in the analysis notebooks (notebooks/)
    "matplotlib",
    # openai sdk for eval's "api" provider (src/eval/generate_api.py) - also speaks
    # DeepSeek's OpenAI-compatible chat completions api, via base_url
    "openai",
    "pre-commit",
    "pytest",
    "pyyaml",
    "radon",
    "tqdm",
    "types-PyYAML",
    "uv",
    # data libraries the benchmark build runs BigCodeBench reference solutions (the
    # oracle) against - needed for the pipeline to work on a core (local) install too
    "beautifulsoup4",
    "lxml",
    "numpy",
    "pandas",
    "python-dateutil",
    "regex",
    "scipy",
]

[project.optional-dependencies]
# GPU training + inference stack - install on the HPC with `uv sync --locked --extra hpc`.
# every entry is marked linux-only, so on other platforms it resolves to nothing and a plain
# `uv sync` (or even `--extra hpc`) installs just the core above.
#
# the versions follow a chain, starting from trl (the GRPO trainer):
# - trl 1.13.0 is tested against vllm >=0.19.1,<=0.28.0, so we take the newest: vllm 0.28.0
# - vllm pins torch, torchvision and torchaudio exactly, so those three follow from it
# - torchcodec (a vllm dependency) is listed only so it can come from the pytorch index too
# - flashinfer-jit-cache holds vllm's flashinfer kernels (eg. token sampling) precompiled -
#   without it flashinfer compiles them on first use, which needs a cuda compiler (nvcc) the
#   nodes don't have. its version must equal the flashinfer-python version vllm pins.
# - transformers and accelerate are pinned to the versions uv resolved for the above
# - flash-linear-attention holds the fast kernels for qwen3.5's linear-attention layers -
#   without it transformers falls back to a pure-torch version, over 10x slower. it is pure
#   python on triton (no compiled cuda libraries), so it runs on isambard as-is.
# isambard's gpu driver (565) supports cuda <=12.7 and cannot run cuda 13, which is what
# pypi's default torch, torchcodec and vllm builds now use - so they (and flashinfer's
# kernels) come from their cuda 12.9 indexes below instead (12.9 runs on the 12.7 driver
# via cuda's minor-version compatibility).
hpc = [
    "accelerate==1.15.0 ; sys_platform == 'linux'",
    "flash-linear-attention==0.5.2 ; sys_platform == 'linux'",
    "flashinfer-jit-cache==0.6.16.post3 ; sys_platform == 'linux'",
    "torch==2.13.0 ; sys_platform == 'linux'",
    "torchaudio==2.11.0 ; sys_platform == 'linux'",
    "torchcodec==0.16.0 ; sys_platform == 'linux'",
    "torchvision==0.28.0 ; sys_platform == 'linux'",
    "transformers==5.17.0 ; sys_platform == 'linux'",
    "trl==1.13.0 ; sys_platform == 'linux'",
    "vllm==0.28.0 ; sys_platform == 'linux'",
    "wandb ; sys_platform == 'linux'",
]

[project.scripts]
run_grpo = "src.run_grpo:main"
run_eval = "src.run_eval:main"

# torch and vllm need their cuda 12.9 builds (see the [hpc] extra above), which live on their
# own indexes rather than pypi.org. marking an index "explicit" scopes it to just the packages
# named here, so uv never considers it for anything else - this is what used to fail (see the
# git history of requirements_fixed.txt): pip/uv resolving *every* package against the pytorch
# index and picking up stale versions mirrored there (eg. requests, numpy), which dragged trl
# down to an ancient release that predates GRPOConfig.
[tool.uv.sources]
flashinfer-jit-cache = { index = "flashinfer-cu129" }
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
torchcodec = { index = "pytorch-cu129" }
vllm = { index = "vllm-cu129" }
# the benchmark package lives in this repo under benchmark/ - install it editable
libreusebench = { path = "benchmark", editable = true }
# the lure package also lives in this repo, under reward/
lure = { path = "reward", editable = true }

# the build pipeline scripts (benchmark/pipeline) are run as files and import sibling build
# helpers; put them on the path so their unit tests can import them too
[tool.pytest.ini_options]
pythonpath = ["benchmark/pipeline"]

# ty can't follow the libreusebench and lure editable installs (they use a custom import
# finder), and the pipeline scripts are run by path - point ty at these directories so
# `libreusebench`, `lure`, `build` and `review` imports resolve (mirroring pytest's pythonpath
# above)
[tool.ty.environment]
extra-paths = [
    "benchmark",
    "benchmark/pipeline",
    "reward",
]

# these files import the GPU stack from the [hpc] extra (torch, transformers, trl, unsloth,
# vllm), which only installs on linux - ignore just the missing imports when checking locally
[[tool.ty.overrides]]
include = [
    "scripts/check_gpu_stack.py",
    "src/eval/evaluate.py",
    "src/eval/generate_vllm.py",
    "src/grpo/config.py",
    "src/grpo/train_model.py",
    "src/run_grpo.py",
    "src/utils/log.py",
]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.uv]
# lock for both the HPC (linux) and local dev (macos); the hpc extra is linux-marked, so it
# resolves to nothing on macos and a single `uv sync` works on either platform
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
# isambard is arm (aarch64): make `uv lock` fail, naming the package, if any wheel-only
# package has no arm build - rather than finding out halfway through an install on the node
required-environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]
# nvidia-cudnn-frontend (a vllm dependency) pulls in cuda 13 libraries from 1.29.0 onwards,
# which isambard's driver can't run - hold it at the releases vllm 0.28.0 was built alongside
constraint-dependencies = ["nvidia-cudnn-frontend<1.29.0"]

[[tool.uv.index]]
name = "flashinfer-cu129"
url = "https://flashinfer.ai/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

# vllm's own index of its cuda 12.9 builds - the url contains the vllm version, so update it
# together with the vllm pin in the [hpc] extra
[[tool.uv.index]]
name = "vllm-cu129"
url = "https://wheels.vllm.ai/0.28.0/cu129"
explicit = true
