# Package specification, as defined here:
# https://packaging.python.org/en/latest/specifications/pyproject-toml/#pyproject-toml-spec

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[project]
name = "src"
readme = "README.md"
version = "0.dev0"
dynamic = ["dependencies"]
authors = [{ name = "Lukas Twist", email = "itsluketwist@gmail.com" }]
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "types-PyYAML",
    "uv",
]

[project.scripts]
run_grpo = "src.run_grpo:main"
eval = "src.cli_eval:main"
