# Package specification, as defined here:
# https://packaging.python.org/en/latest/specifications/pyproject-toml/#pyproject-toml-spec

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[project]
name = "src"
readme = "README.md"
version = "0.dev0"
authors = [{ name = "Lukas Twist", email = "itsluketwist@gmail.com" }]
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.11"
dependencies = [
    "pre-commit",
    "pytest",
    "types-PyYAML",
    "uv",
]

[project.scripts]
run_grpo = "src.run_grpo:main"
run_eval = "src.run_eval:main"

[tool.uv]
# without this, uv pins every package also mirrored on the pytorch index (eg.
# requests, numpy) to the old version found there, which drags trl down to an
# ancient release that predates GRPOConfig.
index-strategy = "unsafe-best-match"
