# Package specification, as defined here:
# https://packaging.python.org/en/latest/specifications/pyproject-toml/#pyproject-toml-spec

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[project]
name = "src"
readme = "README.md"
version = "0.dev0"
authors = [{ name = "Lukas Twist", email = "itsluketwist@gmail.com" }]
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
requires-python = "==3.12.13"
dependencies = [
    # unsloth pins trl and transformers to specific ranges it's tested against (see
    # https://github.com/unslothai/unsloth/blob/main/pyproject.toml) - these ranges are
    # copied from there so uv can only resolve versions unsloth actually supports.
    # after the first `uv lock --upgrade` on the target box, re-pin these (and vllm/
    # flash-attn below) to the exact resolved versions, matching how the rest of this
    # file's dependencies are pinned.
    "accelerate>=0.34.1",
    "datasets>=3.4.1,!=4.0.*,!=4.1.0,<4.4.0",
    "flash-attn==2.8.3.post1 ; sys_platform == 'linux'",
    "huggingface_hub",
    "Jupyter",
    "llm-codegen-research",
    "peft>=0.18.0,!=0.11.0",
    "pre-commit",
    "pytest",
    "pyyaml",
    "radon",
    "torch==2.8.0",
    "torchaudio",
    "torchvision",
    "tqdm",
    "transformers==4.57.6",
    "trl>=0.18.2,!=0.19.0,<=0.24.0",
    "types-PyYAML",
    "unsloth>=2026.7.2",
    "uv",
    "vllm==0.11.0",
    "wandb",
]

[project.scripts]
run_grpo = "src.run_grpo:main"
run_eval = "src.run_eval:main"

# torch/vllm need cuda wheels that only exist on the pytorch index, not pypi.org. marking
# the index "explicit" scopes it to just the packages named in [tool.uv.sources] below, so
# uv never considers it for anything else - this is what used to fail (see the git history
# of requirements_fixed.txt): pip/uv resolving *every* package against the pytorch index and
# picking up stale versions mirrored there (eg. requests, numpy), which dragged trl down to
# an ancient release that predates GRPOConfig.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[tool.uv]
no-build-isolation-package = ["flash-attn"]
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
