# category taxonomy for the library-reuse datasets (see train_dataset/PLAN.md).
#
# two families of "build vs buy" decision points:
#   - product: infra/service choices (the 20 amplify categories) -> product-choice split.
#     their allowlists come mostly from the amplify tool-frequency data, so we only list
#     id/name/stacks here; seed_libraries is optional (stage 02 fills them in).
#   - code: code-level library choices where a mature python library exists but a model is
#     tempted to hand-roll it -> library-usage split. these are not in the amplify
#     data, so seed_libraries (pip import names) is authoritative here.
#
# pipeline/02_build_allowlists.py turns this file (plus the amplify extractions) into
# config/library_allowlists.yaml; extend either family by adding entries here.

