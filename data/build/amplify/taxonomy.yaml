# product category taxonomy for the amplify (product-choice) dataset (see data/README.md).
#
# infra/service "build vs buy" decision points - the 20 amplify categories. their
# allowlists come mostly from the amplify tool-frequency data, so we only list id/name/
# stacks here; build/amplify/allowlists.py fills in the actual tools.

product:
