# deterministic phrasing templates for the library-usage rows (see data/README.md).
#
# each task is wrapped in these templates to produce a row in each of three modes:
#   - repo:   the task is asked inside one vendored python repo's context (see taxonomy.yaml's
#             repo_hint), carrying local_modules
#   - simple: the task is asked on its own, "how do i implement x", with no repo context
#   - script: the task is asked as a stdin/stdout program - here as a one-line request; the
#             claude-generated script wordings are in the LibReuseBench benchmark's template
# each mode has exactly 2 templates; build.py deterministically picks ONE per task (not both),
# so every task gets exactly one template-sourced row per mode. build.py substitutes {context}
# (repo summary), {task} (the task verbatim), {task_lower} (the task with a lowercased first
# letter - kept as-is for acronyms like "POST" - and no trailing full stop, for mid-sentence
# use) and {task_stdio} (the task reworded to drop its "...and return the result" ending, for
# stdin/stdout framing). simple_prompts.json / repo_prompts.json layer one claude-generated
# wording on top of their mode, and script_stage_prompts.json three staged ones on script.
#
# repo_project is not a mode's pick-one list: its one template is added to EVERY task as an
# extra repo row (source "project"). it frames the task as something the user wants to add to
# their own project, without showing any repo context.

repo:
  - "{context}\n\nTask: {task}\n\nImplement this in Python."
  - "{context}\n\nWe need a new helper in this project: {task_lower}. Write it in Python."

repo_project:
  - "{task} Implement this in Python so that I can use it in my project."

simple:
  - "How do I {task_lower} in Python?"
  - "Write a short Python program to {task_lower}."

script:
  - "Write a Python program that reads the necessary input from standard input and prints the result to standard output, to {task_stdio}."
  - "Write a script that takes its input on standard input and prints its output to standard output: {task_stdio}."
