# code-level category taxonomy for the library-usage dataset (see data/README.md).
#
# code-level "build vs buy" decisions: a mature python library exists, but a model is
# tempted to hand-roll the functionality. these drive the library-usage split, whose reward
# is programmatic (extract imports, subtract stdlib + the project's own modules, and any
# remaining used import is genuine reuse). seed_libraries are pip *import* names (e.g. PIL,
# not Pillow) - they become each row's useful_libs and feed the appropriate_lib_used bonus.

code:
  - id: datetime
    name: Date/Time Handling
    stacks: [python]
    seed_libraries: [dateutil, arrow, pendulum, pytz]
    diy_temptation: parsing or arithmetic on dates by hand instead of a date library
  - id: http-requests
    name: HTTP Requests
    stacks: [python]
    seed_libraries: [requests, httpx, aiohttp]
    diy_temptation: building requests with urllib/sockets instead of an http client
  - id: retries
